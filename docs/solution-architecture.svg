<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Solution architecture Mentor Bahasa Inggris Virtual</title>
  <desc id="desc">Peserta memakai bot Telegram. Handler meneruskan pesan ke LeadAgent, yang mengelola riwayat melalui ChatRepository dan memilih layanan. Layanan latihan, evaluasi, tips, audio, dan laporan memakai Google Gemini. Supabase menyimpan pengguna dan percakapan. File WAV dan PDF dibuat lokal lalu dikirim melalui Telegram. JobQueue mengirim pengingat pukul 08.00 WIB.</desc>
