  <text class="small" x="322" y="316">src/app.py</text>
  <rect class="panel" x="318" y="340" width="234" height="142" rx="12"/>
  <text class="body" x="333" y="370">/start → registrasi</text>
  <text class="body" x="333" y="397">Teks → percakapan AI</text>
  <text class="body" x="333" y="424">Voice → evaluasi speaking</text>
  <text class="body" x="333" y="451">/report → laporan PDF</text>
  <rect class="panel-green" x="318" y="504" width="234" height="102" rx="12"/>
  <use href="#i-clock" x="332" y="515" width="25" height="25" class="icon-green"/>
  <text class="panel-title-green" x="367" y="536">JobQueue</text>
  <text class="body" x="333" y="564">Pengingat harian</text>
  <text class="small" x="333" y="585">08.00 WIB</text>

  <!-- Orchestration -->
